<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PMS</title>
    <meta name="description" content="Enterprise property management system for managing properties, tenants, leases, and operations." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Catch fatal JS errors that happen before React mounts
      window.onerror = function(msg, src, line, col, err) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:40px;max-width:600px;margin:80px auto;font-family:system-ui">'
            + '<h2 style="color:#ef4444">⚠️ Application Error</h2>'
            + '<p style="color:#94a3b8">A fatal error occurred before the app could load:</p>'
            + '<pre style="background:#1e293b;color:#f8fafc;padding:16px;border-radius:8px;overflow:auto;font-size:0.78rem;white-space:pre-wrap">'
            + msg + '\n\nSource: ' + src + ':' + line + ':' + col
            + (err && err.stack ? '\n\n' + err.stack : '')
            + '</pre>'
            + '<button onclick="location.reload()" style="margin-top:16px;padding:8px 20px;background:#6366f1;color:#fff;border:none;border-radius:8px;cursor:pointer">Reload</button>'
            + '</div>';
        }
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
